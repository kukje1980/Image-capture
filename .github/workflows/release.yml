# 버전 릴리스 — main 에 반영될 때마다 윈도우·맥·웹 패키지를 만들어 GitHub Release 에 게시한다.
#   https://github.com/<저장소>/releases/tag/v<버전>   (버전: pyproject.toml 의 project.version)
#   https://github.com/<저장소>/releases/tag/windows-latest  (예전 주소 유지 — 윈도우 설치파일)
#   같은 버전으로 다시 실행되면 파일만 새로 덮어쓴다. Actions → "Release" → Run workflow 로 수동 실행도 가능.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  mac:
    uses: ./.github/workflows/build-mac.yml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 웹 테스트
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: 웹 게시용 패키지 (render.yaml + web/)
        run: |
          VER=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          mkdir -p out
          zip -q -r "out/SlitLamp-Web-${VER}.zip" render.yaml web \
            -x 'web/tests/*' 'web/.venv/*' 'web/data/*' '*/__pycache__/*' '*.pyc'
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SlitLamp-web
          path: out/*.zip
          if-no-files-found: error

  release:
    needs: [windows, mac, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 버전 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls -la out
          VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VER}"
          NOTES=$(cat <<NOTES_EOF
          슬릿램프 디지털 영상 시스템 ${TAG} — 커밋 ${GITHUB_SHA}

          | 용도 | 파일 |
          |---|---|
          | 윈도우 설치파일 (기본판) | SlitLampImaging-Setup-${VER}.exe |
          | 윈도우 설치파일 (Keeler 전용) | KeelerSlitLamp-Setup-${VER}.exe |
          | 맥 Apple Silicon (M1~M4) | SlitLampImaging-${VER}-mac-arm64.dmg · KeelerSlitLamp-${VER}-mac-arm64.dmg |
          | 맥 Intel | SlitLampImaging-${VER}-mac-x86_64.dmg · KeelerSlitLamp-${VER}-mac-x86_64.dmg |
          | 웹 게시용 (Render/Vercel) | SlitLamp-Web-${VER}.zip — render.yaml + web/ |

          변경 내용은 저장소의 VERSIONS.md 를 보세요.
          NOTES_EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --latest \
              --title "슬릿램프 영상 시스템 ${TAG}" --notes "$NOTES"
          fi

      - name: windows-latest (예전 고정 주소) 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest out/*.exe \
            --target "${{ github.sha }}" --latest=false \
            --title "윈도우 설치파일 (최신)" \
            --notes "main 최신 코드로 자동 빌드된 윈도우 설치파일입니다. 기본판: SlitLampImaging-Setup, Keeler 전용: KeelerSlitLamp-Setup. 받은 .exe 를 실행해 설치하세요. (커밋 ${{ github.sha }})"
