name: fundus-viewer

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push replaces the build (and the published download) of an older one. A pull request's runs
# have their own group (its number): its first run can start only after the pull request was merged, and
# then its ref is the base branch's — sharing that group cancelled the release build of the merge.
concurrency:
  group: fundus-viewer-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # not the default six hours when the runner's network hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the runner's package mirror sometimes cannot be reached for a while: retry before giving up
      - name: Qt and OpenGL libraries
        timeout-minutes: 20
        run: |
          PKGS="libegl1 libgl1 libxkbcommon-x11-0 xvfb libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4
                libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0"
          for try in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y $PKGS; then
              exit 0
            fi
            echo "apt-get failed (try $try/3), waiting"; sleep $((try * 30))
          done
          exit 1
      - run: pip install -r requirements.txt pytest
      # -o faulthandler_timeout: a test running over 3 minutes prints every thread's stack
      - run: python -m pytest -q -o faulthandler_timeout=180 tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
      # the offscreen platform has no OpenGL: render the 3D eye once more on Mesa (llvmpipe),
      # which also checks that every shader compiles
      - name: 3D eye on OpenGL (Xvfb + Mesa)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -q -rs tests/test_eye3d_gl.py
        env:
          QT_QPA_PLATFORM: xcb
          FUNDUSVIEW_REQUIRE_GL: "1"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q -o faulthandler_timeout=180 tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller fundus_viewer.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: FundusViewer-windows
          path: dist/FundusViewer
      - name: Zip for the release
        shell: bash
        run: (cd dist && 7z a -tzip ../FundusViewer-windows.zip FundusViewer > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: FundusViewer-windows.zip

  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1, M2, M3, M4 …) only: no build for Intel Macs
          - runner: macos-15
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the whole test suite, the .app (Info.plist names the lowest macOS its libraries
      # run on: macos_bundle.py), an ad-hoc signature and the dmg
      - name: Tests, app bundle, ad-hoc signature and dmg
        run: ./build_mac.sh
      - name: Start the bundled app (demo photos)
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          HOME_DIR="$RUNNER_TEMP/fv-home"
          dist/FundusViewer.app/Contents/MacOS/FundusViewer --demo --home "$HOME_DIR" &
          PID=$!
          n=0
          for i in $(seq 1 90); do
            n=$(sqlite3 "$HOME_DIR/Library/fundus.db" "select count(*) from images" 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] && break
            sleep 1
          done
          kill -0 $PID            # still running
          kill $PID || true
          echo "imported demo photos: $n"
          [ "$n" -gt 0 ]
      # render the 3D eye with Apple's OpenGL (the runner's window server
      # provides a context), which also checks that every shader compiles there
      - name: 3D eye on macOS OpenGL
        timeout-minutes: 20       # Apple Silicon: about 4 min
        env:
          FUNDUSVIEW_REQUIRE_GL: "1"
        run: python -m pytest -q -rs tests/test_eye3d_gl.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.label }}
          path: dist/FundusViewer-mac-${{ matrix.label }}.dmg
          if-no-files-found: error
      # "macOS 14.4 Sonoma": the lowest macOS this build runs on, for the download page
      - uses: actions/upload-artifact@v4
        with:
          name: macmin-${{ matrix.label }}
          path: dist/mac-min-${{ matrix.label }}.txt
          if-no-files-found: error

  # Fixed download addresses for the newest builds:
  # https://github.com/<owner>/<repo>/releases/download/fundus-viewer-latest/FundusViewer-windows.zip
  # https://github.com/<owner>/<repo>/releases/download/fundus-viewer-latest/FundusViewer-mac-AppleSilicon.dmg
  # Only the default branch publishes: pushes to other branches (and pull requests) still build
  # and test, but must not replace the public download with unmerged work. A manual run on the
  # default branch (workflow_dispatch) republishes.
  # The download waits for the builds, which run every test themselves (Windows: the whole
  # suite; Mac: the whole suite, the bundled app started, the 3D eye on OpenGL). test-linux
  # stays a check of its own, so a Linux runner that cannot reach its package mirror does
  # not hold the Windows and Mac downloads back.
  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == github.event.repository.default_branch
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the builds as a release (download without logging in)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: macmin-*
          merge-multiple: true
          path: macmin
      # the download page names the lowest macOS of each Mac build (@MAC_MIN_<label>@)
      - name: Release notes
        run: |
          cp docs/release_notes.md "$RUNNER_TEMP/notes.md"
          for f in macmin/mac-min-*.txt; do
            label=$(basename "$f" .txt); label=${label#mac-min-}
            sed -i "s/@MAC_MIN_${label}@/$(head -n 1 "$f")/g" "$RUNNER_TEMP/notes.md"
          done
          if grep -n '@MAC_MIN_' "$RUNNER_TEMP/notes.md"; then
            echo "release notes: a Mac build's lowest macOS is missing" >&2; exit 1
          fi
          grep -n 'macOS' "$RUNNER_TEMP/notes.md" | head -n 5
      - name: Publish latest builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          gh release delete fundus-viewer-latest --yes --cleanup-tag || true
          gh release create fundus-viewer-latest out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "안저 사진 뷰어 (Windows · Mac 최신 빌드)" \
            --notes-file "$RUNNER_TEMP/notes.md"
