name: fundus-viewer

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push replaces the build (and the published download) of an older one
concurrency:
  group: fundus-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # not the default six hours when the runner's network hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the runner's package mirror sometimes cannot be reached for a while: retry before giving up
      - name: Qt and OpenGL libraries
        timeout-minutes: 20
        run: |
          PKGS="libegl1 libgl1 libxkbcommon-x11-0 xvfb libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4
                libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0"
          for try in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y $PKGS; then
              exit 0
            fi
            echo "apt-get failed (try $try/3), waiting"; sleep $((try * 30))
          done
          exit 1
      - run: pip install -r requirements.txt pytest
      # -o faulthandler_timeout: a test running over 3 minutes prints every thread's stack
      - run: python -m pytest -q -o faulthandler_timeout=180 tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
      # the offscreen platform has no OpenGL: render the 3D eye once more on Mesa (llvmpipe),
      # which also checks that every shader compiles
      - name: 3D eye on OpenGL (Xvfb + Mesa)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -q -rs tests/test_eye3d_gl.py
        env:
          QT_QPA_PLATFORM: xcb
          FUNDUSVIEW_REQUIRE_GL: "1"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q -o faulthandler_timeout=180 tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller fundus_viewer.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: FundusViewer-windows
          path: dist/FundusViewer
      - name: Zip for the release
        shell: bash
        run: (cd dist && 7z a -tzip ../FundusViewer-windows.zip FundusViewer > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: FundusViewer-windows.zip

  # Fixed download address for the newest build (Windows only for now — a Mac app is built by hand
  # with ./build_mac.sh when needed):
  # https://github.com/<owner>/<repo>/releases/download/fundus-viewer-latest/FundusViewer-windows.zip
  # Only main publishes: pushes to other branches (and pull requests) still build and test,
  # but must not replace the public download with unmerged work. A manual run on main
  # (workflow_dispatch) republishes.
  # The download waits for the Windows build, which runs the whole test suite itself. test-linux
  # (the same tests, and the 3D eye rendered with OpenGL) stays a check of its own, so a Linux
  # runner that cannot reach its package mirror does not hold the download back.
  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == github.event.repository.default_branch
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the builds as a release (download without logging in)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Publish latest builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          gh release delete fundus-viewer-latest --yes --cleanup-tag || true
          gh release create fundus-viewer-latest out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "안저 사진 뷰어 (Windows 최신 빌드)" \
            --notes-file docs/release_notes.md
