# 임시: Keeler 공식 홈페이지에서 로고 후보·브랜드 색을 가져와 로그로 출력 (확인 후 삭제)
name: Fetch Keeler brand assets
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-brand-assets.yml"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage and logo candidates
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          mkdir -p out
          for SITE in https://www.keeler.co.uk https://www.keelerusa.com https://keelerglobal.com; do
            echo "===== SITE $SITE"
            curl -sL -A "$UA" --max-time 30 -o page.html -w "HTTP %{http_code} -> %{url_effective}\n" "$SITE/"
            [ -s page.html ] || continue
            BASE=$(curl -sL -A "$UA" --max-time 30 -o /dev/null -w "%{url_effective}" "$SITE/" | sed -E 's#(https?://[^/]+).*#\1#')
            echo "--- og/meta/icon tags"
            grep -oiE '<(meta|link)[^>]+(og:image|theme-color|icon|logo)[^>]*>' page.html | head -20
            echo "--- img/svg candidates containing logo"
            grep -oiE '<img[^>]*>' page.html | grep -i logo | head -15
            grep -oiE '(src|href|data-src)="[^"]*logo[^"]*\.(svg|png|webp|jpg)[^"]*"' page.html | sort -u | head -20
            echo "--- inline svg with logo (first 3, truncated)"
            python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="ignore").read()
          for m in list(re.finditer(r'<svg[^>]*>.*?</svg>', h, re.S | re.I))[:40]:
              ctx = h[max(0, m.start()-300):m.start()]
              if re.search(r'logo|brand|keeler', ctx + m.group(0)[:400], re.I):
                  print("INLINE_SVG_BEGIN"); print(m.group(0)[:6000]); print("INLINE_SVG_END")
          PY
            echo "--- download candidates"
            grep -oiE '(src|href|data-src|content)="[^"]*(logo|Logo|LOGO)[^"]*"' page.html | sed -E 's/^[a-z-]+="//; s/"$//' | sort -u | head -8 > cands.txt
            grep -oiE '<meta[^>]+property="og:image"[^>]+content="[^"]+"' page.html | sed -E 's/.*content="([^"]+)".*/\1/' >> cands.txt
            while read -r U; do
              case "$U" in http*) FULL="$U";; //*) FULL="https:$U";; /*) FULL="$BASE$U";; *) FULL="$BASE/$U";; esac
              F="out/$(echo "$FULL" | md5sum | cut -c1-8)_$(basename "${FULL%%\?*}")"
              curl -sL -A "$UA" --max-time 30 -o "$F" "$FULL"
              SZ=$(stat -c %s "$F" 2>/dev/null || echo 0)
              echo "FILE $FULL size=$SZ type=$(file -b --mime-type "$F")"
              if [ "$SZ" -gt 0 ] && [ "$SZ" -lt 80000 ]; then
                echo "B64_BEGIN $FULL"; base64 -w 0 "$F"; echo; echo "B64_END"
              fi
            done < cands.txt
            echo "--- CSS brand colors (top hex frequency)"
            grep -oiE 'href="[^"]+\.css[^"]*"' page.html | sed -E 's/href="//; s/"$//' | head -6 | while read -r C; do
              case "$C" in http*) FULL="$C";; //*) FULL="https:$C";; /*) FULL="$BASE$C";; *) FULL="$BASE/$C";; esac
              curl -sL -A "$UA" --max-time 30 "$FULL"
            done > all.css
            cat page.html all.css | grep -oiE '#[0-9a-f]{6}\b' | tr 'A-F' 'a-f' | sort | uniq -c | sort -rn | head -25
          done
