# macOS 앱(.app) + 설치 디스크 이미지(.dmg) 자동 빌드
#   Actions 탭 → "Build macOS app" → Run workflow 로 수동 실행하거나, 아래 경로가 바뀐 push 때 실행된다.
#   결과물은 실행 화면 아래 Artifacts 에서 내려받는다 (Apple Silicon / Intel 각각).
name: Build macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "assets/**"
      - "build_mac.spec"
      - "build_mac.sh"
      - "requirements.txt"
      - ".github/workflows/build-mac.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1/M2/M3…)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트 (오프스크린)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: 앱 번들 + dmg 빌드
        run: ./build_mac.sh

      - name: 번들 실행 확인 (합성 영상으로 3초 기동)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/SlitLampImaging.app/Contents/MacOS/SlitLampImaging --source synthetic &
          PID=$!
          sleep 8
          kill -0 $PID   # 아직 살아 있으면 정상 기동
          kill $PID || true

      - uses: actions/upload-artifact@v4
        with:
          name: SlitLampImaging-mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
