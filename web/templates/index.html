<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>슬릿램프 영상 시스템</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div class="brand-title">슬릿램프 영상 시스템</div>
      <span class="brand-badge">Web</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-sm" id="btn-folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        저장 폴더 지정
      </button>
      <span class="folder-status" id="folder-status" title="브라우저가 직접 저장할 로컬 폴더"><span class="dot"></span> 폴더 미지정</span>
      <button class="btn btn-icon" id="btn-theme" title="테마 전환" aria-label="테마 전환">
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="hint" id="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="hint-body" id="hint-body">
      캡처한 사진·영상은 <strong>서버(환자 DB + 미디어 폴더)</strong>에 저장되며, 상단 <strong>“저장 폴더 지정”</strong>으로 한 번 권한을 주면 <strong>지정한 로컬 폴더에도 동시에</strong> 저장됩니다(Chrome/Edge). HTTPS 또는 localhost에서만 카메라를 사용할 수 있습니다.
    </div>
    <button class="hint-close" id="hint-close" aria-label="닫기">✕</button>
  </div>

  <div class="patient-strip">
    <span class="strip-label">환자</span>
    <input class="input" type="search" id="patient-search" placeholder="이름/차트번호 검색" style="width:180px">
    <select class="select" id="patient-select" style="min-width:220px" aria-label="환자 선택"></select>
    <button class="btn" id="btn-new-patient">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      신규 환자
    </button>
    <button class="btn" id="btn-edit-patient">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      정보 수정
    </button>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <span class="strip-label">카메라</span>
      <select class="select" id="camera-select" style="min-width:200px" aria-label="카메라 선택"><option>—</option></select>
    </div>
  </div>

  <main class="workspace">
    <section class="video-col">
      <div class="video-frame" id="video-frame">
        <video id="video" autoplay muted playsinline></video>
        <canvas class="freeze" id="freeze"></canvas>
        <div class="video-placeholder" id="video-placeholder">
          <svg class="icon-lg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <p>캡처 장비(또는 웹캠)에 접근할 수 있게 아래 버튼을 눌러 권한을 허용해 주세요.</p>
          <button class="btn btn-primary" id="btn-start-camera">카메라 시작</button>
        </div>
        <div class="badge-rec" id="rec-badge"><span class="rec-dot"></span> REC <span id="rec-time">00:00</span></div>
        <div class="badge-paused">PAUSED</div>
      </div>

      <div class="controls">
        <label class="field-inline" for="eye-select">안구
          <select class="select" id="eye-select">
            <option value="NA">미지정</option>
            <option value="OD">OD (우안)</option>
            <option value="OS">OS (좌안)</option>
            <option value="OU">OU (양안)</option>
          </select>
        </label>
        <button class="btn" id="btn-pause" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          일시정지
        </button>
        <button class="btn btn-primary" id="btn-capture" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          사진 캡처
        </button>
        <button class="btn btn-record" id="btn-record" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
          <span id="rec-btn-label">녹화 시작</span>
        </button>
        <div class="spacer"></div>
        <div class="status-indicator"><span class="status-dot" id="status-dot"></span><span id="status-text">대기 중</span></div>
      </div>
    </section>

    <aside class="thumbs" aria-label="촬영 이미지 목록">
      <div class="thumbs-header">촬영 이미지 <span class="thumbs-count" id="thumb-count">0</span></div>
      <div class="thumbs-list" id="thumb-list">
        <div class="thumbs-empty" id="thumb-empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <div>선택한 환자의<br>촬영 이미지가 없습니다</div>
        </div>
      </div>
    </aside>
  </main>
</div>

<dialog id="patient-dialog" aria-labelledby="patient-dialog-title">
  <div class="dialog-header">
    <div class="dialog-title" id="patient-dialog-title">신규 환자</div>
    <button class="btn btn-ghost btn-icon" type="button" id="patient-x" aria-label="닫기">✕</button>
  </div>
  <form id="patient-form">
    <div class="dialog-body">
      <div class="form-grid">
        <div class="form-row"><label for="p-chart">차트번호 *</label><input required id="p-chart" autocomplete="off"></div>
        <div class="form-row"><label for="p-name">이름 *</label><input required id="p-name" autocomplete="off"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label for="p-birth">생년월일</label><input id="p-birth" placeholder="YYYY-MM-DD" autocomplete="off"></div>
        <div class="form-row"><label for="p-sex">성별</label>
          <select id="p-sex"><option value="">미지정</option><option value="M">남</option><option value="F">여</option><option value="O">기타</option></select>
        </div>
      </div>
      <div class="form-row"><label for="p-phone">연락처</label><input id="p-phone" autocomplete="off"></div>
      <div class="form-row"><label for="p-memo">메모</label><textarea id="p-memo" rows="2"></textarea></div>
      <div class="form-row"><label for="p-symptoms">증상</label><textarea id="p-symptoms" rows="2"></textarea></div>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn btn-ghost danger" id="patient-delete" style="display:none">삭제</button>
      <button type="button" class="btn" id="patient-cancel">취소</button>
      <button type="submit" class="btn btn-primary" id="patient-submit">저장</button>
    </div>
  </form>
</dialog>

<dialog id="viewer-dialog" class="viewer-dialog" aria-labelledby="viewer-title">
  <div class="dialog-header">
    <div class="dialog-title" id="viewer-title">보기</div>
    <button class="btn btn-ghost btn-icon" type="button" id="viewer-close" aria-label="닫기">✕</button>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
  <div class="dialog-footer">
    <a class="btn" id="viewer-download" download>다운로드</a>
    <button class="btn btn-primary" type="button" id="viewer-close-2">닫기</button>
  </div>
</dialog>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
